        ];

        function generateData(totalCount) {
            const locs = [];
            let id = 1;
            
            // Add exact anchor locations
            preciseAreas.forEach(s => {
                const isDhaka = s.d === 'ঢাকা';
                locs.push({
                    id: id++, name: s.n, district: s.d, division: s.div,
                    lat: s.lat, lng: s.lng, 
                    status: isDhaka ? Math.random() > 0.98 : Math.random() > 0.90 // 98% load shedding in Dhaka, 90% elsewhere
                });
            });

            const remaining = totalCount - locs.length;

            for (let i = 0; i < remaining; i++) {
                // Randomly pick a district to spread data naturally
                const anchor = allDistricts[Math.floor(Math.random() * allDistricts.length)];
                
                // Radius in degrees (~10-15km) to scatter naturally around the district center
                const r = 0.15 * Math.sqrt(Math.random()); 
                const theta = Math.random() * 2 * Math.PI;
                const latOffset = r * Math.cos(theta);
                const lngOffset = r * Math.sin(theta);
                
                const areaNames = ['সদর', 'নিউ মার্কেট', 'ক্যান্টনমেন্ট', 'রেলওয়ে কলোনি', 'হাউজিং এস্টেট', 'পৌরসভা এলাকা', 'বাজার এলাকা', 'শিল্প এলাকা', 'হাসপাতাল রোড', 'থানা রোড', 'স্কুল পাড়া', 'উত্তর পাড়া', 'দক্ষিণ পাড়া', 'হাইওয়ে সংলগ্ন', 'আবাসিক এলাকা'];
                const prefixes = ['শ্রী', 'রাম', 'শিব', 'কালী', 'দুর্গা', 'নবী', 'রহমত', 'ফজল', 'করিম', 'রহিম', 'খাঁ', 'মীর', 'সৈয়দ', 'শেখ', 'কাজল', 'নীল', 'লাল', 'সবুজ', 'সোনার', 'রূপার'];
                const suffixes = ['পুর', 'গঞ্জ', 'নগর', 'দিয়া', 'খালী', 'তলা', 'বাড়ী', 'হাট', 'বাজার', 'গ্রাম', 'কান্দি', 'চর', 'দ্বীপ', 'টেক', 'বাগ', 'বন', 'পাহাড়', 'তলী'];
                
                let areaName = '';
                if (Math.random() > 0.5) {
                    areaName = `${anchor.d} ${areaNames[Math.floor(Math.random() * areaNames.length)]}`;
                } else {
                    const randomPrefix = prefixes[Math.floor(Math.random() * prefixes.length)];
                    const randomSuffix = suffixes[Math.floor(Math.random() * suffixes.length)];
                    areaName = randomPrefix + randomSuffix;
                }
                
                const isDhaka = anchor.d === 'ঢাকা';

                locs.push({
                    id: id++,
                    name: areaName,
                    district: anchor.d,
                    division: anchor.div,
                    lat: anchor.lat + latOffset,
                    lng: anchor.lng + lngOffset,
                    status: isDhaka ? Math.random() > 0.98 : Math.random() > 0.90 // 98% chance of Load shedding in Dhaka
                });
            }
            
            return locs;
        }

        const appData = generateData(1200);

        function biddutApp() {
            return {
                isDark: false,
                activeTab: 'feed', // 'feed' or 'directory'
                searchQuery: '',
                locations: appData,
                liveFeed: [],
                logIdCounter: 1,
                map: null,
                markersMap: {},
                isMapAnimating: false,
                
                init() {
                    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                        this.isDark = true;
                    } else {
                        this.isDark = false;
                    }
                    this.applyTheme();

                    this.$nextTick(() => {
                        this.initMap();
                        
                        const offlineExamples = this.locations.filter(l => !l.status).slice(0, 4);
                        const onlineExamples = this.locations.filter(l => l.status).slice(0, 1);
                        [...offlineExamples, ...onlineExamples].sort(() => Math.random() - 0.5).forEach(loc => this.addLog(loc, loc.status));

                        // Dynamic grid simulation every 4 seconds
                        setInterval(() => this.simulateGridEvent(), 4000);
                        
                        window.addEventListener('resize', () => {
                            if (this.map) this.map.invalidateSize();
                        });
                    });
                    
                    this.$watch('searchQuery', () => {
                        this.updateMapMarkersVisibility();
                        if(this.searchQuery.length > 0 && this.activeTab !== 'directory') {
                            this.activeTab = 'directory';
                        }
                    });

                    this.$watch('activeTab', () => {
                         setTimeout(() => { if (this.map) this.map.invalidateSize(); }, 50);
                    });
                },

                toggleTheme() {
                    this.isDark = !this.isDark;
                    localStorage.theme = this.isDark ? 'dark' : 'light';
                    this.applyTheme();
                },

                applyTheme() {
                    if (this.isDark) document.documentElement.classList.add('dark');
                    else document.documentElement.classList.remove('dark');
                    if (this.map) {
                        this.updateAllMarkersStyle();
                    }
                },

                initMap() {
                    // Strict bounding box for Bangladesh to prevent viewing other countries
                    const bangladeshBounds = L.latLngBounds(
                        [20.5, 87.8], // Southwest coordinates
                        [26.7, 92.8]  // Northeast coordinates
                    );

                    this.map = L.map('map', {
                        center: [23.6850, 90.3563],
                        zoom: 7,
                        minZoom: 6,
                        maxZoom: 13,
                        maxBounds: bangladeshBounds, // Restrict panning strictly to Bangladesh
                        maxBoundsViscosity: 1.0, // Solid wall effect on borders
                        zoomControl: false,
                        attributionControl: false,
                        preferCanvas: true // Canvas rendering for massive performance boost
                    });

                    L.control.zoom({ position: 'topright' }).addTo(this.map);

                    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                        subdomains: 'abcd'
                    }).addTo(this.map);

                    this.map.on('movestart', () => this.isMapAnimating = true);
                    this.map.on('moveend', () => this.isMapAnimating = false);
                    this.map.on('zoomstart', () => this.isMapAnimating = true);
                    this.map.on('zoomend', () => this.isMapAnimating = false);

                    this.renderAllMarkers();
                    setTimeout(() => { if (this.map) this.map.invalidateSize(); }, 600);
                },

                getMarkerStyle(status) {
                    if(status) {
                        return {
                            radius: 5,
                            fillColor: '#22c55e', // Vibrant Green
                            color: '#ffffff',
                            weight: 1,
                            opacity: 1,
                            fillOpacity: 1,
                            className: 'glow-effect' // CSS glow effect added
                        }
                    } else {
                        return {
                            radius: 3.5,
                            fillColor: '#dc2626', // Red for load-shedding
                            color: this.isDark ? '#000000' : '#ffffff',
                            weight: 0.5,
                            opacity: 0.8,
                            fillOpacity: 0.7,
                            className: ''
                        }
                    }
                },
                
                updateAllMarkersStyle() {
                    this.locations.forEach(loc => {
                        const marker = this.markersMap[loc.id];
                        if (marker) {
                            marker.setStyle(this.getMarkerStyle(loc.status));
                        }
                    });
                },

                renderAllMarkers() {
                    this.locations.forEach(loc => {
                        const marker = L.circleMarker([loc.lat, loc.lng], this.getMarkerStyle(loc.status)).addTo(this.map);

                        const statusText = loc.status 
                            ? '<span style="color:#22c55e;font-weight:600;">বিদ্যুৎ আছে</span>' 
                            : '<span style="color:#dc2626;font-weight:600;">লোডশেডিং</span>';
                            
                        marker.bindPopup(`
                            <div style="font-family:'Noto Sans Bengali', sans-serif;">
                                <strong style="font-size:14px;">${loc.name}</strong><br>
                                <span style="color:var(--tw-colors-neutral-500); font-size:12px;">${loc.district}, ${loc.division}</span><br>
                                <div style="margin-top:4px;">অবস্থা: ${statusText}</div>
                            </div>
                        `);
                        
                        this.markersMap[loc.id] = marker;
                    });
                },

                updateMapMarkersVisibility() {
                    const q = this.searchQuery.toLowerCase().trim();
                    this.locations.forEach(loc => {
                        const marker = this.markersMap[loc.id];
                        if (!marker) return;
                        
                        const isMatch = q === '' || 
                                        loc.name.toLowerCase().includes(q) || 
                                        loc.district.toLowerCase().includes(q) || 
                                        loc.division.toLowerCase().includes(q);
                                        
                        if (isMatch) {
                            if (!this.map.hasLayer(marker)) this.map.addLayer(marker);
                        } else {
                            if (this.map.hasLayer(marker)) this.map.removeLayer(marker);
                        }
                    });
                },

                focusMapOn(loc) {
                    if (window.innerWidth < 1024) {
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    }
                    
                    this.map.flyTo([loc.lat, loc.lng], 13, {
                        duration: 1,
                        easeLinearity: 0.25
                    });
                    const marker = this.markersMap[loc.id];
                    if (marker) {
                        setTimeout(() => marker.openPopup(), 1000);
                    }
                },

                get stats() {
                    let online = 0; let offline = 0;
                    for (let i = 0; i < this.locations.length; i++) {
                        if (this.locations[i].status) online++; else offline++;
                    }
                    return { online, offline };
                },

                get filteredDivisions() {
                    const q = this.searchQuery.toLowerCase().trim();
                    const groups = {};
                    
                    this.locations.forEach(loc => {
                        const isMatch = q === '' || 
                                        loc.name.toLowerCase().includes(q) || 
                                        loc.district.toLowerCase().includes(q) || 
                                        loc.division.toLowerCase().includes(q);
                                        
                        if (isMatch) {
                            if (!groups[loc.division]) groups[loc.division] = [];
                            groups[loc.division].push(loc);
                        }
                    });
                    
                    return Object.keys(groups).sort((a, b) => {
                        const rankA = divisionRank[a] || 99;
                        const rankB = divisionRank[b] || 99;
                        if (rankA !== rankB) return rankA - rankB;
                        return a.localeCompare(b);
                    }).map(div => ({
                        name: div,
                        areas: groups[div].sort((x, y) => x.name.localeCompare(y.name))
                    }));
                },

                get filteredCount() {
                    return this.filteredDivisions.reduce((acc, div) => acc + div.areas.length, 0);
                },

                simulateGridEvent() {
                    if (this.isMapAnimating) return; 

                    // Dynamic Grid Logic: Keep online areas between 3% and 8% to maintain extreme panic
                    const total = this.locations.length;
                    const onlineCount = this.locations.filter(l => l.status).length;
                    const onlineRatio = onlineCount / total;

                    let bringPowerBack = false;
                    if (onlineRatio < 0.03) {
                        bringPowerBack = true;
                    } else if (onlineRatio > 0.08) {
                        bringPowerBack = false;
                    } else {
                        bringPowerBack = Math.random() > 0.85; 
                    }
                    
                    const candidates = this.locations.filter(l => l.status !== bringPowerBack);
                    if (candidates.length === 0) return;
                    
                    const targetIndex = Math.floor(Math.random() * candidates.length);
                    const target = candidates[targetIndex];
                    
                    target.status = bringPowerBack;
                    
                    const marker = this.markersMap[target.id];
                    if (marker) {
                        marker.setStyle(this.getMarkerStyle(target.status));
                        
                        const statusText = target.status 
                            ? '<span style="color:#22c55e;font-weight:600;">বিদ্যুৎ আছে</span>' 
                            : '<span style="color:#dc2626;font-weight:600;">লোডশেডিং</span>';
                            
                        marker.setPopupContent(`
                            <div style="font-family:'Noto Sans Bengali', sans-serif;">
                                <strong style="font-size:14px;">${target.name}</strong><br>
                                <span style="color:var(--tw-colors-neutral-500); font-size:12px;">${target.district}, ${target.division}</span><br>
                                <div style="margin-top:4px;">অবস্থা: ${statusText}</div>
                            </div>
                        `);
                    }
                    
                    this.addLog(target, target.status);
                },

                addLog(location, newStatus) {
                    const now = new Date();
                    let hours = now.getHours();
                    const minutes = now.getMinutes().toString().padStart(2, '0');
                    const ampm = hours >= 12 ? 'PM' : 'AM';
                    hours = hours % 12; hours = hours ? hours : 12; 
                    
                    const timeString = `${hours}:${minutes} ${ampm}`;
                    
                    let messageTemplate = '';
                    if (newStatus) {
                        messageTemplate = `<span class="font-semibold text-neutral-900 dark:text-neutral-100">${location.name}</span>, ${location.district}-এ কারেন্ট এসেছে।`;
                    } else {
                        messageTemplate = `<span class="font-semibold text-neutral-900 dark:text-neutral-100">${location.name}</span>, ${location.district}-এ লোডশেডিং শুরু হলো।`;
                    }

                    this.liveFeed.unshift({
                        id: this.logIdCounter++,
                        message: messageTemplate,
                        time: timeString,
                        status: newStatus
                    });

                    if (this.liveFeed.length > 30) this.liveFeed.pop();
                }
            }
        }
    </script>
